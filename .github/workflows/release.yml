name: Build release installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  installer:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || github.event.head_commit.message == 'Bootstrap release v1.0.0'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}' -replace '^v', ''
            $tag = "v$v"
          } elseif ('${{ github.ref }}' -like 'refs/tags/*') {
            $tag = '${{ github.ref_name }}'
            $v = $tag -replace '^v', ''
          } else {
            $v = '1.0.0'
            $tag = 'v1.0.0'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\SolidWorksSlicerBridge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidWorksSlicerBridge-${{ steps.version.outputs.version }}-Setup-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $file = Get-ChildItem release\*.exe | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $file.FullName --target $env:GITHUB_SHA --generate-notes --title "SolidWorks Slicer Bridge $tag" --repo $env:GITHUB_REPOSITORY
          }
