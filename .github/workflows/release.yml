name: Build release installer

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version, e.g. 1.0.5'
        required: true
        default: '1.0.5'

permissions:
  contents: write

concurrency:
  group: release-installer
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = $env:REQUESTED_VERSION -replace '^v', ''
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Test native IDispatch callbacks on PowerShell 5.1
        shell: powershell
        timeout-minutes: 3
        run: |
          & .\tests\Test-CallbackDispatch.ps1
          if (-not $?) { exit 1 }

      - name: Test installer dependency deployment on PowerShell 5.1
        shell: powershell
        timeout-minutes: 3
        run: |
          & .\tests\Test-InstallerDependencies.ps1
          if (-not $?) { exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Setup.exe
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" "installer\SolidWorksSlicerBridge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-Item "release\SolidWorksSlicerBridge-$env:RELEASE_VERSION-Setup-x64.exe"
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath "$($file.FullName).sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidWorksSlicerBridge-${{ steps.version.outputs.version }}-Setup-x64
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Use a new version instead of overwriting published artifacts."
          }
          $file = Get-Item "release\SolidWorksSlicerBridge-$env:RELEASE_VERSION-Setup-x64.exe"
          gh release create $env:RELEASE_TAG $file.FullName "$($file.FullName).sha256" --target $env:GITHUB_SHA --generate-notes --title "SolidWorks Slicer Bridge $env:RELEASE_TAG" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
